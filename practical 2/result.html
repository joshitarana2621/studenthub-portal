    <main>
        <h2>Result Search</h2>
        <form action="result.html" method="get">
            <p>
                <label for="select_semester">select semester</label><br>
                <select id="select_semester" name="select_semester" size="4">
                    <option value="1" selected>1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                </select>
            </p>

            <p>
                <label for="select_branch">select branch</label><br>
                <select id="select_branch" name="select_branch" size="3">
                    <option value="computer_science">computer science</option>
                    <option value="computer" selected>computer</option>
                    <option value="information_technology">information technology</option>
                </select>
            </p>

            <p>
                <label for="select_exam_session">select exam session</label><br>
                <select id="select_exam_session" name="select_exam_session" size="2">
                    <option value="month">month</option>
                    <option value="month_duration">month duration</option>
                </select>
            </p>

            <p>
                <label for="id_no">enter id no</label><br>
                <input type="text" id="id_no" name="id_no">
            </p>

            <p>
                <button type="submit">submit</button>
            </p>
        </form>
    </main>
